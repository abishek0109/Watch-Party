version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncscreen_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: syncscreen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: syncscreen_server
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/syncscreen?schema=public"
      JWT_SECRET: "syncscreen_super_secret_jwt_key_2026_cinematic"
      TMDB_API_KEY: ""
      CORS_ORIGIN: "http://localhost:5173"
      NODE_ENV: "production"
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: syncscreen_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
